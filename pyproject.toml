[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "simplegen"
version = "0.5.2"
description = "Concept to finished ComfyUI video. Simple, Effective, Useful."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.8,<6.9", "httpx>=0.28,<1", "websocket-client>=1.8,<2", "boto3>=1.35,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[project.scripts]
simplegen = "simplegen.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simplegen", "src/simplegen_runpod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/simplegen/h3scene/{build,run,plan,room,produce}.py" = ["ALL"]
